{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfyaGPT — Admin & Stakeholder Portal Login</title>
    <link rel="icon" type="image/png" href="{% static 'images/app_logo.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0D47A1 0%, #1565C0 50%, #0D47A1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 440px;
            padding: 40px;
        }
        .btn-afya-gold {
            background-color: #FBC02D;
            color: #0D47A1;
            font-weight: 700;
            border-radius: 12px;
            padding: 12px;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-afya-gold:hover {
            background-color: #FDD835;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{% static 'images/app_logo.png' %}" alt="AfyaGPT Logo" style="height:60px; width:60px; border-radius:12px; background:white; padding:4px; box-shadow:0 4px 15px rgba(0,0,0,0.1);" class="mb-3">
            <h4 class="fw-bold text-dark mb-1">AfyaGPT Portal Login</h4>
            <p class="text-muted small">Admin & Stakeholder Control Center</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}info{% endif %} alert-dismissible fade show rounded-3 small py-2" role="alert">
            <i class="fa-solid fa-circle-exclamation me-1"></i> {{ message }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-primary"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-start-0" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-primary"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-afya-gold">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Log In to Dashboard
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="/" class="text-decoration-none small text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Public Landing Page
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
